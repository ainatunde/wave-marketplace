version: '3'

services:
  medusa:
    image: medusajs/medusa
    ports:
      - '9000:9000'
    environment:
      MEDUSA_DATABASE_TYPE: postgres
      MEDUSA_DATABASE_URL: postgres://medusa:medusa_password@postgres:5432/medusa
    depends_on:
      - postgres

  frontend:
    image: nextjs/nextjs
    ports:
      - '3000:3000'
    depends_on:
      - medusa

  postgres:
    image: postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_password
      POSTGRES_DB: medusa

  redis:
    image: redis
    ports:
      - '6379:6379'
